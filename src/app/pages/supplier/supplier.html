<div class="container">

    <!-- FORMULARIO -->
    <div class="card">
  
      <h2>Registrar Proveedor</h2>
  
      <form>
  
        <div class="form-grid">
  
          <div class="form-group">
            <label for="ruc">RUC</label>
            <input
              id="ruc"
              type="text"
              name="ruc"
              [(ngModel)]="newSupplier.ruc"
              placeholder="Ingrese el RUC">
          </div>
  
          <div class="form-group">
            <label for="legalName">Razon Social</label>
            <input
              id="legalName"
              type="text"
              name="legalName"
              [(ngModel)]="newSupplier.legalName"
              placeholder="Ingrese la razon social">
          </div>
  
          <div class="form-group">
            <label for="address">Direccion</label>
            <input
              id="address"
              type="text"
              name="address"
              [(ngModel)]="newSupplier.address"
              placeholder="Ingrese la dirección">
          </div>
  
          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input
              id="phone"
              type="text"
              name="phone"
              [(ngModel)]="newSupplier.phone"
              placeholder="Ingrese el teléfono">
          </div>
        </div>
  
        <div class="form-actions">
          <button
            type="button"
            class="btn-primary"
            (click)="createSupplier()">
            Guardar
          </button>
        </div>
  
      </form>
  
    </div>
  
  
    <!-- TABLA -->
    <div class="card">
  
      <h2>Lista de Proveedores</h2>
  
      <div class="table-container">
  
        <table>
  
          <thead>
            <tr>
              <th>ID</th>
              <th>RUC</th>
              <th>Razon Social</th>
              <th>Dirección</th>
              <th>Telefono</th>
              <th>Estado</th>
            </tr>
          </thead>
  
          <tbody>
            @for (supplier of suppliers; track supplier.supplierId) {
              <tr>
                <td>{{ supplier.supplierId }}</td>
                <td>{{ supplier.ruc }}</td>
                <td>{{ supplier.legalName }}</td>
                <td>{{ supplier.address }}</td>
                <td>{{ supplier.phone }}</td>
                <td>{{ supplier.supplierStatus }}</td>
              </tr>
            }
  
          </tbody>
  
        </table>
  
      </div>
  
    </div>
  
  </div>
